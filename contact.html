<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://static.wixstatic.com"><link rel="stylesheet" href="assets/styles.css">
<title>Contact Tillman Tough</title><meta name="description" content="Contact Tillman Tough about products, orders, availability, bulk purchasing and sourcing."></head>
<body><div id="siteHeader"></div>
<main><section class="page-hero"><div class="container"><div class="eyebrow">Support</div><h1>Tell us what the job requires.</h1><p>Ask about a product, an order, availability, delivery or an item that needs to be sourced.</p></div></section>
<section class="section"><div class="container tool-layout"><form class="panel" id="contactForm"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Reason</label><select name="reason"><option>Product question</option><option>Existing order</option><option>Availability</option><option>Bulk purchase</option><option>Product sourcing</option></select><label>Message</label><textarea name="message" rows="8" required></textarea><button class="primary">Prepare message</button></form><aside class="panel"><h3>Faster help starts with better information.</h3><p>Include the SKU or manufacturer part number whenever possible.</p><a class="secondary" href="bulk-order.html">Bulk order by SKU</a><br><br><a class="secondary" href="source-item.html">Source an item</a></aside></div></section></main>
<div id="siteFooter"></div><script src="data/products.js"></script><script src="scripts/site.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{$('#contactForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const body=[...fd.entries()].map(([k,v])=>`${k.toUpperCase()}\n${v}`).join('\n\n');location.href=`mailto:info@tillmantough.com?subject=${encodeURIComponent(fd.get('reason'))}&body=${encodeURIComponent(body)}`}});
</script></body></html>
